openapi: 3.0.3
info:
  title: WorkflowHub API
  version: 1.0.0
  description: Core API contract for auth, tasks, comments, notifications, and users.
servers:
  - url: http://localhost:4000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      allOf:
        - $ref: '#/components/schemas/AuthRequest'
        - type: object
          required: [name]
          properties:
            name:
              type: string
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [submitted, in_review, approved, rejected, completed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        created_by:
          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API healthy
  /auth/register:
    post:
      summary: Register a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered and authenticated
  /auth/login:
    post:
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
  /auth/me:
    get:
      summary: Get current profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
  /tasks:
    get:
      summary: List tasks (supports search/filter/sort/pagination)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task list payload
    post:
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                assigned_to:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Task created
  /tasks/{id}:
    get:
      summary: Get task by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task detail
    put:
      summary: Update task (title/description/assignment)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted
  /tasks/{id}/status:
    patch:
      summary: Transition task status (reviewer/admin permissions enforced)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [submitted, in_review, approved, rejected, completed]
      responses:
        '200':
          description: Status updated
        '403':
          description: Forbidden by RBAC
  /tasks/{id}/history:
    get:
      summary: Get task audit history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: History entries
  /tasks/stats:
    get:
      summary: Dashboard task stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated stats
  /tasks/{taskId}/comments:
    get:
      summary: List comments for task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment list
    post:
      summary: Add comment to task
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '201':
          description: Comment created
  /notifications:
    get:
      summary: List notifications for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification list
  /notifications/unread-count:
    get:
      summary: Get unread notifications count
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count payload
  /notifications/{id}/read:
    patch:
      summary: Mark single notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated notification
  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bulk update complete
  /users:
    get:
      summary: List users (admin/reviewer only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
  /users/{id}:
    get:
      summary: Get user by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User detail
    put:
      summary: Update user profile fields
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
  /users/me/password:
    put:
      summary: Change current user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed
