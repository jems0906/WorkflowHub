name: Smoke CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflowhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workflowhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workflowhub
      JWT_SECRET: ci_jwt_secret_workflowhub_2026_strong_value
      FRONTEND_URL: http://localhost:5173
      PORT: 4000
      SMOKE_API_BASE_URL: http://localhost:4000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build backend
        run: npm run build --prefix backend

      - name: Run migrations and seed
        run: |
          npm run migrate --prefix backend
          npm run seed --prefix backend

      - name: Start backend
        run: |
          node backend/dist/index.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/api/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat backend.log || true
          exit 1

      - name: Run API smoke regression
        shell: pwsh
        run: ./scripts/smoke-api.ps1

      - name: Run RBAC smoke regression
        shell: pwsh
        run: ./scripts/smoke-rbac.ps1

      - name: Run strict preflight gate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          PREFLIGHT_STRICT: '1'
        run: ./scripts/preflight.ps1

      - name: Emit combined success marker
        run: echo "SMOKE_ALL_RESULT=pass"

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
